set_assignment_stage:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: canvas
    assignment_id:
      required: true
      example: "5506356"
      selector:
        text:
    student_id:
      required: false
      example: 6021
      selector:
        number:
          mode: box
    stage:
      required: false
      selector:
        select:
          translation_key: stage
          options:
            - not_started
            - working
            - done_not_submitted
            - submitted_claimed
            - studying
            - ready
            - needs_makeup
    note:
      required: false
      selector:
        text:
          multiline: true
    kind:
      required: false
      selector:
        select:
          translation_key: assignment_kind
          options:
            - auto
            - homework
            - quiz
            - test

set_followup_stage:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: canvas
    followup_id:
      required: true
      example: "6021:5506356:late_work"
      selector:
        text:
    stage:
      required: false
      selector:
        select:
          translation_key: followup_stage
          options:
            - needs_contact
            - contacted
            - resolved
    method:
      required: false
      selector:
        select:
          translation_key: followup_method
          options:
            - email
            - late_form
            - in_person
    note:
      required: false
      selector:
        text:
          multiline: true

review_assignment:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: canvas
    assignment_id:
      required: true
      example: "5506356"
      selector:
        text:
    student_id:
      required: false
      example: 6021
      selector:
        number:
          mode: box
    role:
      required: false
      default: student
      selector:
        select:
          translation_key: review_role
          options:
            - student
            - parent
    undo:
      required: false
      default: false
      selector:
        boolean:

close_assignment:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: canvas
    assignment_id:
      required: true
      example: "5506356"
      selector:
        text:
    student_id:
      required: false
      example: 6021
      selector:
        number:
          mode: box
    reason:
      required: false
      selector:
        select:
          translation_key: close_reason
          options:
            - feedback_received
            - not_graded
            - other
    note:
      required: false
      selector:
        text:
          multiline: true
    undo:
      required: false
      default: false
      selector:
        boolean:
